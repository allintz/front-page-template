name: Daily build

on:
  schedule:
    - cron: "0 10 * * *"   # 6am EDT / 5am EST (GitHub may start it up to ~30 min late)
  workflow_dispatch:        # "Run workflow" button for a build on demand
    inputs:
      dry_run:
        description: "Build without publishing"
        type: boolean
        default: false

concurrency: build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Build and publish
        env:
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
          # API key (Max-plan credits) wins when set; otherwise the Claude Code OAuth token.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          ARGS=""; [ "${{ inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          python generate.py $ARGS || { echo "retrying in 5 minutes"; sleep 300; python generate.py $ARGS; }
